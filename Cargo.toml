[package]
name = "aws-sigv4-proxy"
version = "0.1.13"
authors = ["Oleksii Karpenko <alexkarpenko@yahoo.com>"]
description = "Proxy to apply AWS SigV4 to requests"
rust-version = "1.95"
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.13.0", features = ["behavior-version-latest"] }
aws-credential-types = "1.3.1"
aws-sigv4 = { version = "1.6.3" }
aws-smithy-runtime = { version = "1.16.1", default-features = false }
aws-smithy-runtime-api = { version = "1.19.1", default-features = false }
clap = { version = "4.6.7", features = ["derive", "env"] }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = [
    "http1",
    "aws-lc-rs",
    "rustls-native-certs",
    "tls12",
    "webpki-roots",
] }
hyper-util = { version = "0.1.21", default-features = false, features = [
    "client",
    "client-legacy",
    "http1",
    "server-auto",
    "server-graceful",
    "tokio",
] }
rustls = { version = "0.23.46", features = ["aws-lc-rs"], default-features = false }
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt-multi-thread", "signal"] }
tokio-rustls = { version = "0.26.6", features = ["aws-lc-rs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0.11"

[dev-dependencies]
aws-sdk-s3 = { version = "1.155.0", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
] }
rstest = "0.28.0"
testcontainers = { version = "0.28.0", default-features = false, features = ["aws-lc-rs"] }
